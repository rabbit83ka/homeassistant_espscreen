# ESP Screens - cyd-24-cap: a 2.4-inch 320 x 240 panel. Written by tools/new_board.py from the cyd
# board: its packages and its hardware sections are the template's until they are replaced by this board's
# (docs/ADDING_A_BOARD.md). docs/PROFILES.md says how the files of a screen fit together.
packages:
  # How every board's firmware is built (ESP-IDF, as ESPHome recommends it).
  build: !include ../hardware/esp-idf.yaml
  # Wide update slots for 4 MB of flash, and the way a screen that is out there gets them.
  flash: !include ../hardware/flash-4mb.yaml
  # Every size of the compact look, scaled to DISPLAY_DPI below. This glass is where that look was drawn.
  look: !include ../looks/compact.yaml
  # Geändert auf kapazitiven Touch
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  self_test: !include ../features/self-test.yaml
  # RGB-LED Paket entfernt, da GPIO4 für den Display-Reset benötigt wird

substitutions:
  # The key of this board file; the firmware reports it so ESP Screens knows what board a screen is.
  BOARD_ID: "cyd-24-cap"
  DEVICE_NAME: "cyd-24-cap-new"
  DEVICE_FRIENDLY_NAME: "My cyd-24-cap"

  # The glass: the panel's own pixels and its density, 400 diagonal pixels over 2.4 inches.
  PANEL_W: "320"
  PANEL_H: "240"
  DISPLAY_DPI: "125" # war 166.667
  # The tile grid: columns and rows of cells lying down, and standing up.
  GRID_COLS: "2"
  GRID_ROWS: "2"
  GRID_COLS_PORTRAIT: "1"
  GRID_ROWS_PORTRAIT: "4"
  LVGL_BUFFER_SIZE: "12%"                       # LVGL's draw buffer as a share of the screen

  # From the cyd board: its hardware values and the code it hands the shared lambdas. Replace them
  # with this board's, as the hardware sections below.
  # The bedside clock draws with the display step this board has anyway: its own digits, a page tall, cost about 40 KB of
  # a 4 MB board's slot, which is close to full (looks/shared/digits.yaml).
  BEDSIDE_OWN_DIGITS: "0"

  DISPLAY_MODEL: "ILI9341"                      # ESPHome's mipi_spi model of the display controller
  DISPLAY_DATA_RATE: "40MHz"                    # the display's SPI clock; 40MHz matches ESPHome's board preset
  DISPLAY_INVERT_COLORS: "false"
  BACKLIGHT_FREQUENCY: "1000Hz"                 # the backlight's PWM; see the output block (GitHub #42)
  # XPT2046 Kalibrierungswerte entfernt, da der kapazitive cst816 diese nicht nutzt.

# ============================================================
# No need to edit below this line.
# ============================================================

esp32:
  board: esp32dev
  framework:
    advanced:
      # ESPHome recommends this itself in the boot log. Yields ~40KB extra IRAM
      # and a smaller binary, and every KB counts on this board.
      sram1_as_iram: true
  variant: esp32

# Nur noch ein SPI Bus für das Display (Touch nutzt I2C)
spi:
  - id: lcd
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

# I2C Bus für den kapazitiven Touch hinzugefügt
i2c:
  id: touch_bus
  sda: GPIO33
  scl: GPIO32
  scan: true

output:
  - platform: ledc
    pin: GPIO27
    id: gpio_backlight_pwm
    frequency: ${BACKLIGHT_FREQUENCY}

# Touchscreen configuration (CST816, kapazitiv, via I2C)
touchscreen:
  - platform: cst816
    id: ts_touch
    display: my_display
    calibration:
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 240

# Display configuration (ILI9341)
display:
  - platform: mipi_spi
    id: my_display
    spi_id: lcd
    model: ${DISPLAY_MODEL}
    data_rate: ${DISPLAY_DATA_RATE}
    cs_pin: 15
    dc_pin: 2
    reset_pin: 4
    invert_colors: ${DISPLAY_INVERT_COLORS}
    color_order: BGR
    update_interval: never
    auto_clear_enabled: false

    # Panel tuning aus der Vorlage belassen (keine Optimierung entfernt)
    init_sequence:
      - [0xB4, 0x07]
      - [0xB1, 0x00, 0x10]

    dimensions:
      width: 240
      height: 320
      
sensor:
  - platform: adc
    pin: GPIO34
    id: light_sensor_volts
    name: "Lichtsensor Spannung"
    update_interval: 1s
    attenuation: 12db
    filters:
      - median:
          window_size: 5
          send_every: 1
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1
